<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>

<body>
    <form>
        <h2>Contact Us Today!</h2>

        <div>
            <label for="name">First Name </label>
            <input type="text" id="name" placeholder="Enter your FirstName">
        </div>

        <div>
            <label for="lname">Last Name </label>
            <input type="text" id="lname" placeholder="Enter your LastName">
        </div>

        <div>
            <label for="email">E-Mail</label>
            <input type="email" id="email" placeholder="Enter your E-mail">
        </div>

        <div>
            <label for="pno">Phone #</label>
            <input type="tel" id="pno" placeholder="Enter your Phone No">
        </div>

        <div>
            <label for="address">Address</label>
            <textarea id="address" placeholder="Enter your Address"></textarea>
        </div>

        <div>
            <label for="city">City</label>
            <input type="text" id="city" placeholder="city">
        </div>

        <div>
            <label for="state">State</label>
            <select id="state">
                <option value="" selected disabled> --select--</option>
                <option value="Tamil Nadu">Tamil Nadu</option>
                <option value="Kerala">Kerala</option>
                <option value="Karnataka">Karnataka</option>
                <option value="Andhra Prahesh">Andhra Prahesh</option>
            </select>
        </div>

        <div>
            <label for="code">Zip Code</label>
            <input type="number" id="code" placeholder="Enter your Code">
        </div>

        <div>
            <label for="domail">Enter your Domail Name</label>
            <input type="text" id="domail" placeholder="Enter your Domail Name">
        </div>

        <div>
            <label for="host">Do You have Hosting ?</label>

            <input type="radio" name="host" id="yes"><label for="yes">Yes</label>
            <input type="radio" name="host" id="no"><label for="no">No</label>
        </div>

        <div>
            <label for="dis">Project Description</label>
            <textarea  id="dis" placeholder="Project Description"></textarea>
        </div>

        <button>
            Cancel
        </button>

        <input type="submit">

    </form>



</body>

</html>
